
<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>לו"ז אישי של לב</title>
    <link rel="icon" type="image/x-icon" href="./lev.ico">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#172120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="לו״ז לב">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #172120;
            --surface: #1f2b29;
            --surface-2: #283735;
            --surface-3: #334442;
            --border: #31433f;
            --text: #e5eeec;
            --text-muted: #9bb0ab;
            --text-dim: #667f7a;
            --accent: #86c2b8;
            --accent-2: #a9d6cd;
            --accent-ink: #102120;
            --mda: #eb9aa8;
            --mda-bg: rgba(235,154,168,.15);
            --gym: #e6c078;
            --gym-bg: rgba(230,192,120,.15);
            --training: #82cdb3;
            --training-bg: rgba(130,205,179,.15);
            --personal: #a9b6c2;
            --personal-bg: rgba(169,182,194,.15);
            --holiday-chag: #b9a8e2;
            --holiday-chag-bg: rgba(185,168,226,.16);
            --holiday-fast: #e2a898;
            --holiday-fast-bg: rgba(226,168,152,.16);
            --holiday-memorial: #8fb1dd;
            --holiday-memorial-bg: rgba(143,177,221,.16);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --shadow: 0 10px 28px rgba(0,0,0,.35);
            --safe-b: env(safe-area-inset-bottom,0px)
        }

        html[data-theme="light"] {
            --bg: #f3f6f4;
            --surface: #fcfdfc;
            --surface-2: #eaf0ed;
            --surface-3: #dbe5e1;
            --border: #d8e3de;
            --text: #263635;
            --text-muted: #647b78;
            --text-dim: #9fb2ae;
            --accent: #4f9088;
            --accent-2: #7fb8ae;
            --accent-ink: #fff;
            --mda: #d4677f;
            --mda-bg: rgba(212,103,127,.11);
            --gym: #b98a2e;
            --gym-bg: rgba(185,138,46,.12);
            --training: #3f9d80;
            --training-bg: rgba(63,157,128,.11);
            --personal: #7b8a99;
            --personal-bg: rgba(123,138,153,.12);
            --holiday-chag: #7b62c2;
            --holiday-chag-bg: rgba(123,98,194,.1);
            --holiday-fast: #bd6a58;
            --holiday-fast-bg: rgba(189,106,88,.1);
            --holiday-memorial: #4f7bb5;
            --holiday-memorial-bg: rgba(79,123,181,.1);
            --shadow: 0 10px 28px rgba(50,80,75,.1)
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html, body {
            height: 100%
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Heebo",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
            font-size: 14px;
            line-height: 1.45;
            overscroll-behavior-y: none
        }

        button, input, select, textarea {
            font-family: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        input, select, textarea {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 14px;
            width: 100%
        }

            input:focus, select:focus, textarea:focus {
                outline: 2px solid var(--accent);
                outline-offset: 1px
            }

        label {
            display: block;
            font-size: 12.5px;
            color: var(--text-muted);
            margin: 14px 0 6px
        }

            label:first-child {
                margin-top: 0
            }

        h1, h2, h3 {
            margin: 0;
            font-weight: 700
        }

        .app {
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg);
            padding: 16px 16px 10px
        }

        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .greet {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -.2px
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent)
        }

            .icon-btn svg {
                width: 18px;
                height: 18px
            }

        main {
            flex: 1;
            padding: 0 16px 100px
        }

        .view {
            display: none;
            animation: fade .18s ease
        }

            .view.active {
                display: block
            }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .segmented {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 3px;
            margin-bottom: 14px
        }

            .segmented button {
                flex: 1;
                background: transparent;
                border: 0;
                padding: 8px 4px;
                border-radius: 11px;
                font-size: 13px;
                color: var(--text-muted);
                font-weight: 600
            }

                .segmented button.active {
                    background: var(--accent);
                    color: var(--accent-ink)
                }

        .datenav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px
        }

            .datenav .label {
                font-size: 15px;
                font-weight: 700
            }

            .datenav .arrows {
                display: flex;
                gap: 6px
            }

            .datenav button {
                background: var(--surface);
                border: 1px solid var(--border);
                width: 32px;
                height: 32px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--accent)
            }

                .datenav button svg {
                    width: 15px;
                    height: 15px
                }

                .datenav button.btn {
                    width: auto;
                    height: auto;
                    background: var(--accent);
                    color: var(--accent-ink);
                    border: 0
                }

            .datenav .today-chip {
                width: auto;
                height: auto
            }

        .today-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: 600
        }

        .weekstrip {
            display: flex;
            gap: 6px;
            margin-bottom: 16px
        }

        .chip-holiday {
            font-size: 8px;
            font-weight: 700;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 1px
        }

        .mc-holiday {
            font-size: 6.5px;
            font-weight: 700;
            line-height: 1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .holiday-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--cbg);
            border: 1px solid var(--c);
            color: var(--c);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 14px
        }

            .holiday-banner svg {
                width: 16px;
                height: 16px;
                flex: none
            }

        .daychip {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 2px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center
        }

            .daychip .dow {
                font-size: 10.5px;
                color: var(--text-muted)
            }

            .daychip .num {
                font-size: 15px;
                font-weight: 700
            }

            .daychip.selected {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--accent-ink)
            }

                .daychip.selected .dow {
                    color: var(--accent-ink);
                    opacity: .75
                }

            .daychip .dots {
                display: flex;
                gap: 2px;
                height: 5px
            }

                .daychip .dots span {
                    width: 4px;
                    height: 4px;
                    border-radius: 50%
                }

        .agenda-empty {
            text-align: center;
            padding: 56px 20px;
            color: var(--text-muted)
        }

            .agenda-empty .big {
                font-size: 34px;
                margin-bottom: 10px
            }

            .agenda-empty .cta {
                display: inline-block;
                margin-top: 14px
            }

        .ev-card {
            display: flex;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden
        }

            .ev-card::before {
                content: "";
                position: absolute;
                inset-inline-start: 0;
                top: 0;
                bottom: 0;
                width: 4px;
                background: var(--c)
            }

        .ev-time {
            min-width: 52px;
            text-align: center
        }

            .ev-time .t1 {
                font-weight: 700;
                font-size: 14px
            }

            .ev-time .t2 {
                font-size: 11.5px;
                color: var(--text-muted)
            }

        .ev-body {
            flex: 1;
            min-width: 0
        }

        .ev-title-row {
            display: flex;
            align-items: center;
            gap: 6px
        }

        .ev-icon {
            width: 16px;
            height: 16px;
            color: var(--c);
            flex: none
        }

        .ev-title {
            font-weight: 700;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .ev-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px
        }

        .ev-tag {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            margin-top: 6px;
            background: var(--cbg);
            color: var(--c)
        }

            .ev-tag.muted {
                background: var(--surface-2);
                color: var(--text-muted)
            }

        .ev-warn {
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--mda);
            display: flex;
            align-items: center;
            gap: 4px
        }

            .ev-warn svg {
                width: 13px;
                height: 13px
            }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 5px
        }

        .month-dow {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            padding-bottom: 6px;
            font-weight: 600
        }

        .month-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative
        }

            .month-cell.out {
                opacity: .32
            }

            .month-cell.today {
                border-color: var(--accent)
            }

            .month-cell.selected {
                background: var(--accent)
            }

                .month-cell.selected .mc-num {
                    color: var(--accent-ink)
                }

        .mc-num {
            font-size: 13px;
            font-weight: 700
        }

        .mc-dots {
            display: flex;
            gap: 2px
        }

            .mc-dots span {
                width: 4px;
                height: 4px;
                border-radius: 50%
            }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 14px
        }

            .card.hero {
                background: linear-gradient(135deg,var(--accent),var(--accent-2));
                border: 0;
                color: var(--accent-ink);
                box-shadow: var(--shadow)
            }

                .card.hero .section-title {
                    color: var(--accent-ink);
                    opacity: .8
                }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 20px 0 10px
        }

            .section-title:first-child {
                margin-top: 0
            }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px
        }

            .stat.tap {
                cursor: pointer;
                border-color: var(--surface-3)
            }

            .stat .num {
                font-size: 22px;
                font-weight: 800;
                font-variant-numeric: tabular-nums
            }

            .stat .lbl {
                font-size: 11.5px;
                color: var(--text-muted);
                margin-top: 2px
            }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px
        }

            .bar-row .lbl {
                width: 78px;
                font-size: 12px;
                color: var(--text-muted);
                flex: none
            }

        .bar-track {
            flex: 1;
            height: 10px;
            background: var(--surface-2);
            border-radius: 6px;
            overflow: hidden
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px
        }

        .bar-row .val {
            width: 70px;
            text-align: left;
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex: none
        }

        .client-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-bottom: 10px
        }

        .client-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px
        }

        .client-name {
            font-weight: 700;
            font-size: 15px
        }

        .client-phone {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px
        }

        .pkg-pill {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 20px;
            background: var(--training-bg);
            color: var(--training);
            white-space: nowrap
        }

            .pkg-pill.low {
                background: var(--mda-bg);
                color: var(--mda)
            }

        .client-goals {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 8px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 0;
            border-radius: var(--radius-sm);
            padding: 11px 16px;
            font-weight: 700;
            font-size: 13.5px;
            width: 100%
        }

            .btn svg {
                width: 16px;
                height: 16px
            }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-ink)
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border)
        }

        .btn-danger {
            background: var(--mda-bg);
            color: var(--mda)
        }

        .btn-sm {
            width: auto;
            padding: 8px 12px;
            font-size: 12.5px
        }

        .row-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px
        }

            .row-btns .btn {
                flex: 1
            }

        .type-picker {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px
        }

        .type-opt {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px
        }

            .type-opt svg {
                width: 18px;
                height: 18px;
                color: var(--c)
            }

            .type-opt span {
                font-size: 11px;
                font-weight: 700
            }

            .type-opt.selected {
                border-color: var(--c);
                background: var(--cbg)
            }

        .field-row {
            display: flex;
            gap: 10px
        }

            .field-row > div {
                flex: 1
            }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 2px;
            border-bottom: 1px solid var(--border)
        }

            .toggle-row:last-child {
                border-bottom: 0
            }

            .toggle-row .t-main {
                font-size: 13.5px;
                font-weight: 600
            }

            .toggle-row .t-sub {
                font-size: 11.5px;
                color: var(--text-muted);
                margin-top: 1px
            }

        .switch {
            position: relative;
            width: 42px;
            height: 24px;
            background: var(--surface-3);
            border-radius: 20px;
            flex: none;
            border: 1px solid var(--border)
        }

            .switch.on {
                background: var(--accent);
                border-color: var(--accent)
            }

            .switch::after {
                content: "";
                position: absolute;
                top: 2px;
                inset-inline-start: 2px;
                width: 18px;
                height: 18px;
                background: #fff;
                border-radius: 50%;
                transition: transform .15s
            }

        html[dir="rtl"] .switch.on::after {
            transform: translateX(-18px)
        }

        .alert {
            display: flex;
            gap: 10px;
            background: var(--mda-bg);
            border: 1px solid rgba(212,103,127,.3);
            color: var(--mda);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 12.5px;
            margin-top: 12px
        }

            .alert svg {
                width: 16px;
                height: 16px;
                flex: none;
                margin-top: 1px
            }

            .alert b {
                display: block;
                margin-bottom: 2px;
                font-size: 13px
            }

            .alert.soft {
                background: var(--surface-2);
                border-color: var(--border);
                color: var(--text-muted)
            }

        .bottomnav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30
        }

        .bottomnav-inner {
            max-width: 520px;
            margin: 0 auto;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 6px 6px calc(6px + var(--safe-b))
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 7px 2px;
            color: var(--text-dim);
            border-radius: 12px
        }

            .nav-btn svg {
                width: 20px;
                height: 20px
            }

            .nav-btn span {
                font-size: 10.5px;
                font-weight: 600
            }

            .nav-btn.active {
                color: var(--accent)
            }

        .fab {
            position: fixed;
            bottom: calc(72px + var(--safe-b));
            left: 50%;
            transform: translateX(-50%);
            z-index: 31;
            background: var(--accent);
            color: var(--accent-ink);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 0;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center
        }

            .fab svg {
                width: 24px;
                height: 24px
            }

        .modal-wrap {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none
        }

            .modal-wrap.open {
                display: block
            }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(3,6,16,.6)
        }

        .modal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 520px;
            margin: 0 auto;
            background: var(--bg);
            border-radius: 22px 22px 0 0;
            max-height: 90vh;
            overflow-y: auto;
            padding: 14px 18px calc(24px + var(--safe-b));
            border: 1px solid var(--border);
            border-bottom: 0
        }

        .modal-handle {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 3px;
            margin: 0 auto 12px
        }

        .modal-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 4px
        }

        .modal-close {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted)
        }

            .modal-close svg {
                width: 14px;
                height: 14px
            }

        .empty-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 12.5px;
            padding: 30px 10px
        }

        ::selection {
            background: var(--accent);
            color: var(--accent-ink)
        }

            function refreshFromServer() {
                var user = auth.currentUser;
                if (!user || localPending || !storageReady) return;

                    if (!localPending && doc.exists) applyRemoteDoc(doc);

            /* ---- חישוב מה השתנה מקומית מאז הסנכרון האחרון ---- */
            function indexById(a) { var m = {}; (a || []).forEach(function (x) { m[x.id] = x; }); return m; }
            function computeChanges(base, cur) {
                var ch = { events: { up: [], del: [] }, clients: { up: [], del: [] }, settings: {}, empty: true };
                ['events', 'clients'].forEach(function (k) {
                    var b = indexById(base[k]), c = indexById(cur[k]);
                    Object.keys(c).forEach(function (id) {
                        if (!b[id] || stable(b[id]) !== stable(c[id])) { ch[k].up.push(c[id]); ch.empty = false; }
                    });
                    Object.keys(b).forEach(function (id) {
                        if (!c[id]) { ch[k].del.push(id); ch.empty = false; }
                    });
                });
                Object.keys(cur.settings || {}).forEach(function (key) {
                    if (stable((base.settings || {})[key]) !== stable(cur.settings[key])) { ch.settings[key] = cur.settings[key]; ch.empty = false; }
                });
                return ch;
            }
            function applyChanges(target, ch) {
                ['events', 'clients'].forEach(function (k) {
                    var list = (target[k] || []).filter(function (x) { return ch[k].del.indexOf(x.id) === -1; });
                    ch[k].up.forEach(function (item) {
                        var i = list.findIndex(function (x) { return x.id === item.id; });
                        if (i >= 0) list[i] = item; else list.push(item);
                    });
                    target[k] = list;
                });
                target.settings = Object.assign({}, DEFAULT_DATA.settings, target.settings || {}, ch.settings);
            }

            function saveDataToFirebase() {
                if (isGuest) return;

                if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
                localPending = false;

                var ch = computeChanges(baseData || { events: [], clients: [], settings: {} }, DATA);
                if (ch.empty) return;                       // אין שינוי אמיתי = לא כותבים כלום

                var ref = db.collection('users').doc(user.uid);
                db.runTransaction(function (tx) {
                    return tx.get(ref).then(function (doc) {
                        var srv = doc.exists ? doc.data() : {};
                        var merged = Object.assign({}, DEFAULT_DATA, srv);
                        merged.settings = Object.assign({}, DEFAULT_DATA.settings, srv.settings || {});
                        applyChanges(merged, ch);
                        merged = cloneData(merged);
                        tx.set(ref, merged);
                        return merged;
                    });
                }).then(function (merged) {
                    baseData = cloneData(merged);
                    if (!localPending) { DATA = cloneData(merged); applyTheme(); renderAll(); }
                }).catch(function (e) {
                    console.error(e);
                    localPending = true;                    // לא נשמר - ננסה שוב
                    if (e.code === 'unavailable' || /offline/i.test(e.message || '')) {
                        retryTimer = setTimeout(saveDataToFirebase, 10000);

            function bufMs(ev) { return (ev.type !== 'personal' && ev.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0; }
            function findConflicts(draft, excludeId) {
                var r = eventRange(draft), b = bufMs(draft);
                var ps = r.start.getTime() - b, pe = r.end.getTime() + b;
                return DATA.events.filter(function (ev) {
                    if (ev.id === excludeId) return false;
                    var o = eventRange(ev), ob = bufMs(ev);
                    return ps < o.end.getTime() + ob && o.start.getTime() - ob < pe;
                });
            }
            function findFatigueIssues(draft, excludeId) {
                var issues = [], restMs = DATA.settings.mdaRestHours * 3600000, r = eventRange(draft);
                if (draft.type !== 'mda' && draft.mdaShiftType !== 'night') {
                    DATA.events.filter(function (e) { return e.type === 'mda' && e.mdaShiftType === 'night' && e.id !== excludeId; }).forEach(function (mda) {
                        var mEnd = eventRange(mda).end, until = new Date(mEnd.getTime() + restMs);
                        if (r.start.getTime() < until.getTime() && r.end.getTime() > mEnd.getTime()) issues.push({ type: 'blocked-after-shift', restUntil: until, mda: mda });
                    });
                }
                if (draft.type === 'mda' && draft.mdaShiftType === 'night') {
                    var until2 = new Date(r.end.getTime() + restMs);
                    DATA.events.filter(function (e) { return (e.type === 'gym' || e.type === 'training') && e.id !== excludeId; }).forEach(function (ev) {
                        var o = eventRange(ev);
                        if (o.start.getTime() < until2.getTime() && o.end.getTime() > r.end.getTime()) issues.push({ type: 'conflicts-with-rest', restUntil: until2, ev: ev });
                    });

            function shiftMult(ev) { return parseDateStr(ev.date).getDay() === 6 ? 1.5 : 1; } /* שבת = 150% */
            /* ---------- finance ---------- */
            document.getElementById('finPrev').addEventListener('click', function () { var d = new Date(state.financeMonth); d.setMonth(d.getMonth() - 1); state.financeMonth = d; renderFinance(); });
            document.getElementById('finNext').addEventListener('click', function () { var d = new Date(state.financeMonth); d.setMonth(d.getMonth() + 1); state.financeMonth = d; renderFinance(); });

            function renderFinance() {
                var y = state.financeMonth.getFullYear(), m = state.financeMonth.getMonth();
                document.getElementById('finLabel').textContent = MONTHS[m] + ' ' + y;
                var inMonth = DATA.events.filter(function (e) { var d = parseDateStr(e.date); return d.getFullYear() === y && d.getMonth() === m; });
                var now = new Date(), gymH = 0, gymBase = 0, gymC = 0, mdaH = 0, tCount = 0, tInc = 0, tSched = 0;
                inMonth.forEach(function (ev) {
                    var r = eventRange(ev), hrs = (r.end - r.start) / 3600000, done = r.end.getTime() <= now.getTime();
                    if (ev.type === 'gym' && done) { gymH += hrs; gymBase += hrs * DATA.settings.gymHourlyRate * shiftMult(ev); gymC += (ev.commission || 0); }

                    '<div class="section-title">חלוקת שעות</div><div class="card">' + financeBar('ניהול', gymH, (gymH + mdaH) || 1, 'var(--gym)', true) + financeBar('מד"א (התנדבות)', mdaH, (gymH + mdaH) || 1, 'var(--mda)', true) + '</div>';
                document.getElementById('statGym').addEventListener('click', function () { openGymFinanceDetail(y, m); });
                document.getElementById('statTraining').addEventListener('click', function () { openTrainingFinanceDetail(y, m); });
                document.getElementById('statTrainCount').addEventListener('click', function () { openTrainingCountDetail(y, m); });

            function financeBar(label, val, total, color, hours) {

            function openGymFinanceDetail(y, m) {

                }).sort(function (a, b) { return a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime); });

                var list = shifts.map(function (ev) {

            function trainingHeld(y, m) {
                return DATA.events.filter(function (e) {
                    if (e.type !== 'training' || !(e.status === 'attended' || e.status === 'late-cancel')) return false;

            function openTrainingFinanceDetail(y, m) {

            function openTrainingCountDetail(y, m) {

                held.forEach(function (ev) { var n = clientName(ev); counts[n] = (counts[n] || 0) + 1; });

                showFinDetail('<div class="modal-title">אימונים שבוצעו</div><div class="empty-note" style="padding:2px 0 14px;text-align:right">' + MONTHS[m] + ' ' + y + ' · סה"כ ' + held.length + ' אימונים</div>' + rows);
            }

            /* ---------- recurring manager ---------- */
            function openRecurringManager() { renderRecurringList(); document.getElementById('modalRecurring').classList.add('open'); }
            function renderRecurringList() {
                var todayStr = toDateStr(new Date()), groups = {};
                DATA.events.forEach(function (ev) { if (ev.recurringId) (groups[ev.recurringId] = groups[ev.recurringId] || []).push(ev); });
                var ids = Object.keys(groups), holder = document.getElementById('recurringBody');
                if (!ids.length) { holder.innerHTML = '<div class="empty-note">אין כרגע אירועים חוזרים מוגדרים</div>'; return; }
                holder.innerHTML = ids.map(function (rid) {
                    var list = groups[rid].sort(function (a, b) { return a.date.localeCompare(b.date); }), first = list[0];
                    var meta = TYPE_META[first.type] || TYPE_META.personal;
                    var future = list.filter(function (e) { return e.date >= todayStr; }), past = list.length - future.length;
                    var cl = first.type === 'training' && first.clientId ? DATA.clients.find(function (c) { return c.id === first.clientId; }) : null;
                    var nameLine = (first.title || meta.label) + (cl ? ' · ' + cl.name : '');
                    return '<div class="client-card"><div style="display:flex;align-items:center;gap:8px"><span class="ev-icon" style="--c:' + meta.color + '">' + meta.icon + '</span><div style="flex:1"><div style="font-weight:700">' + escapeHtml(nameLine) + '</div><div style="font-size:12px;color:var(--text-muted)">כל יום ' + DOW[parseDateStr(first.date).getDay()] + "' · " + first.startTime + '–' + first.endTime + '</div></div></div>' +
                        '<div style="font-size:12px;color:var(--text-muted);margin-top:8px">' + future.length + ' מופעים עתידיים' + (past ? ' · ' + past + ' כבר עברו' : '') + '</div>' +
                        '<div class="row-btns"><button class="btn btn-danger btn-sm" data-cancel-recurring="' + rid + '"' + (future.length ? '' : ' disabled style="opacity:.5"') + '>ביטול האירוע החוזר מהיום ואילך</button></div></div>';
                }).join('');
                holder.querySelectorAll('[data-cancel-recurring]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var rid = btn.dataset.cancelRecurring;
                        if (!confirm('לבטל את כל המופעים העתידיים של האירוע החוזר הזה (מהיום ואילך)? מופעים שכבר עברו יישארו.')) return;
                        DATA.events = DATA.events.filter(function (e) { return !(e.recurringId === rid && e.date >= todayStr); });
                        saveData(); renderRecurringList(); renderSchedule();
                        if (state.view === 'finance') renderFinance();
                    });
                });
            }

            /* ---------- local notifications ---------- */
            function isStandaloneMode() { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
            function isIOSDevice() { return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
            var deferredInstallPrompt = null;
            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault(); deferredInstallPrompt = e;
                var btn = document.getElementById('installAppBtn'); if (btn) btn.style.display = 'flex';
            });
            function showAppNotification(title, body, tag) {
                var opts = { body: body, icon: './icon-192.png', badge: './icon-192.png', tag: tag, dir: 'rtl', lang: 'he' };
                if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(function (reg) { reg.showNotification(title, opts); }).catch(function () { try { new Notification(title, opts); } catch (e) { } });
                } else { try { new Notification(title, opts); } catch (e) { } }
            }
            function getNotifiedSet() { try { return new Set(JSON.parse(localStorage.getItem('lev_notified_events') || '[]')); } catch (e) { return new Set(); } }
            function saveNotifiedSet(set) { try { localStorage.setItem('lev_notified_events', JSON.stringify(Array.from(set).slice(-500))); } catch (e) { } }
            function checkReminders() {
                if (!storageReady) return;
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                var now = new Date();
                if (DATA.settings.notificationsEnabled) {
                    var rms = (DATA.settings.reminderMinutes || 60) * 60000, notified = getNotifiedSet();
                    DATA.events.forEach(function (ev) {
                        var key = 'ev_' + ev.id;
                        if (notified.has(key)) return;
                        var diff = eventRange(ev).start.getTime() - now.getTime();
                        if (diff > 0 && diff <= rms) {
                            var meta = TYPE_META[ev.type] || TYPE_META.personal, body = ev.title || meta.label;
                            if (ev.type === 'training' && ev.clientId) { var c = DATA.clients.find(function (x) { return x.id === ev.clientId; }); if (c) body = 'אימון עם ' + c.name; }
                            showAppNotification('עוד ' + Math.round(diff / 60000) + " דק' - " + meta.label, body + ' בשעה ' + ev.startTime, key);
                            notified.add(key); saveNotifiedSet(notified);
                        }
                    });
                }
                if (DATA.settings.morningSummaryEnabled) {
                    var todayStr = toDateStr(now), last = localStorage.getItem('lev_last_summary_date');
                    var parts = (DATA.settings.morningSummaryTime || '07:00').split(':').map(Number);
                    var st = new Date(now); st.setHours(parts[0] || 7, parts[1] || 0, 0, 0);
                    if (last !== todayStr && now.getTime() >= st.getTime()) {
                        var todays = eventsOnDate(now);
                        var body2 = todays.length ? todays.map(function (e) { return e.startTime + ' - ' + (e.title || TYPE_META[e.type].label); }).join(' | ') : 'אין פעילויות מתוכננות להיום';
                        showAppNotification('סיכום היום שלך', body2, 'morning-summary');
                        try { localStorage.setItem('lev_last_summary_date', todayStr); } catch (e) { }
                    }
                }
            }
            setInterval(checkReminders, 30000);
            setInterval(function () { autoFinalizeTrainings(); if (state.view === 'finance') renderFinance(); }, 60000);

            /* ---------- settings ---------- */
            function renderSettings() {
                var s = DATA.settings, holder = document.getElementById('settingsHolder');
                var supported = ('Notification' in window), perm = supported ? Notification.permission : 'unsupported', note;
                if (!supported) note = 'הדפדפן הזה לא תומך בהתראות.';
                else if (perm === 'granted') note = 'הרשאת התראות ניתנה ✓';
                else if (perm === 'denied') note = 'ההתראות חסומות ברמת הדפדפן/המכשיר. יש לאפשר זאת ידנית בהגדרות המכשיר כדי שהתזכורות יעבדו.';
                else note = 'יש להפעיל את המתג כדי לאשר קבלת התראות מהדפדפן.';
                var recCount = new Set(DATA.events.filter(function (e) { return e.recurringId; }).map(function (e) { return e.recurringId; })).size;
                holder.innerHTML =
                    '<div class="section-title" style="margin-top:0">תעריפים</div><div class="card"><label>תעריף שעתי – ניהול (₪) — בשבת ×150% אוטומטית</label><input type="number" id="s_rate" value="' + s.gymHourlyRate + '" step="0.1"><label>מחיר אימון אישי (₪)</label><input type="number" id="s_price" value="' + s.trainingPrice + '" step="5"></div>' +
                    '<div class="section-title">חסימות ומרווחים</div><div class="card"><label>זמן נסיעה/התארגנות בין פעילויות (דקות)</label><input type="number" id="s_buffer" value="' + s.bufferMinutes + '" step="5"><label>שעות מנוחה נדרשות אחרי משמרת לילה במד"א</label><input type="number" id="s_rest" value="' + s.mdaRestHours + '" step="0.5"></div>' +
                    '<div class="section-title">אירועים חוזרים</div><div class="card"><div class="empty-note" style="padding:6px 0 12px;text-align:right">' + recCount + ' סדרות אירועים חוזרים מוגדרות כרגע.</div><button class="btn btn-ghost" id="openRecurringBtn">' + ICONS.repeat + ' ניהול אירועים חוזרים</button></div>' +
                    '<div class="section-title">התראות ותזכורות</div><div class="card">' +
                    '<div class="toggle-row"><div><div class="t-main">תזכורות לפני פעילות</div><div class="t-sub">התראה בדפדפן/באפליקציה המותקנת לפני כל פעילות</div></div><div class="switch ' + (s.notificationsEnabled ? 'on' : '') + '" id="s_notif"></div></div>' +
                    '<label>כמה דקות לפני להתריע</label><input type="number" id="s_remind_min" value="' + (s.reminderMinutes || 60) + '" min="5" step="5">' +
                    '<div class="toggle-row"><div><div class="t-main">סיכום בוקר יומי</div><div class="t-sub">התראה יומית עם רשימת הפעילויות של היום</div></div><div class="switch ' + (s.morningSummaryEnabled ? 'on' : '') + '" id="s_morning"></div></div>' +
                    '<label>שעת סיכום בוקר</label><input type="time" id="s_morning_time" value="' + (s.morningSummaryTime || '07:00') + '">' +
                    '<div class="alert soft">' + ICONS.bell + '<div><b>סטטוס הרשאה</b>' + note + '</div></div>' +
                    '<div class="alert soft">' + ICONS.warn + '<div><b>לתשומת לבך</b>התראות אלו פועלות כל עוד הדפדפן פתוח, או ברקע אם התקנת את האפליקציה למסך הבית. התראות שמגיעות גם כשהאפליקציה סגורה לחלוטין דורשות שרת דחיפה ייעודי ואינן זמינות בגרסה הזו.</div></div></div>' +
                    '<div class="section-title">כללי</div><div class="card"><div class="toggle-row"><div><div class="t-main">מצב כהה</div><div class="t-sub">עיצוב נוח לעיניים בשעות החושך</div></div><div class="switch ' + (s.theme === 'dark' ? 'on' : '') + '" id="s_theme"></div></div></div>' +
                    '<div class="section-title">התקנה ומצב לא-מקוון</div><div class="card"><div class="empty-note" style="padding:6px 0 12px;text-align:right">התקנת האפליקציה למסך הבית מאפשרת פתיחה מהירה, ועובדת גם עם קליטה חלשה - הנתונים יסתנכרנו אוטומטית ברגע שהאינטרנט יחזור.</div><button class="btn btn-ghost" id="installAppBtn" style="display:' + (isStandaloneMode() ? 'none' : 'flex') + ';margin-bottom:8px">' + ICONS.download + ' התקנת האפליקציה על המכשיר</button></div>' +
                    '<div class="section-title">סנכרון יומן</div><div class="card"><div class="empty-note" style="padding:6px 0 12px;text-align:right">אפשר לייצא את הלו"ז כקובץ ICS ולייבא אותו ידנית ליומן של Google / Apple.</div><button class="btn btn-ghost" id="exportIcsBtn">ייצוא ICS</button></div>' +
                    '<div class="section-title">נתונים</div><div class="card"><button class="btn btn-danger" id="resetBtn">' + ICONS.trash + ' איפוס כל הנתונים</button></div>' +
                    '<div class="empty-note">הנתונים נשמרים באופן פרטי בחשבון שלך בלבד.</div>';

                document.getElementById('s_theme').addEventListener('click', function () { this.classList.toggle('on'); s.theme = this.classList.contains('on') ? 'dark' : 'light'; applyTheme(); saveData(); });
                var map = { s_rate: 'gymHourlyRate', s_price: 'trainingPrice', s_buffer: 'bufferMinutes', s_rest: 'mdaRestHours' };
                Object.keys(map).forEach(function (id) { document.getElementById(id).addEventListener('change', function (e) { s[map[id]] = parseFloat(e.target.value) || 0; saveData(); }); });
                document.getElementById('openRecurringBtn').addEventListener('click', openRecurringManager);
                function bindNotif(elId, key) {
                    document.getElementById(elId).addEventListener('click', function () {
                        var sw = this;
                        if (!sw.classList.contains('on')) {
                            if (!supported) { alert('הדפדפן הזה לא תומך בהתראות'); return; }
                            Notification.requestPermission().then(function (p) {
                                if (p === 'granted') { sw.classList.add('on'); s[key] = true; }
                                else { s[key] = false; alert('לא ניתנה הרשאה להתראות. יש לאפשר זאת בהגדרות הדפדפן/המכשיר.'); }
                                saveData(); renderSettings();
                            });
                        } else { sw.classList.remove('on'); s[key] = false; saveData(); }
                    });
                }
                bindNotif('s_notif', 'notificationsEnabled');
                bindNotif('s_morning', 'morningSummaryEnabled');
                document.getElementById('s_remind_min').addEventListener('change', function (e) { s.reminderMinutes = parseInt(e.target.value) || 60; saveData(); });
                document.getElementById('s_morning_time').addEventListener('change', function (e) { s.morningSummaryTime = e.target.value || '07:00'; saveData(); });
                var ib = document.getElementById('installAppBtn');
                if (ib) ib.addEventListener('click', function () {
                    if (deferredInstallPrompt) { deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; }); }
                    else if (isIOSDevice()) alert('כדי להתקין באייפון/אייפד: לחצו על כפתור השיתוף (Share) בסרגל של ספארי, ואז "הוספה למסך הבית".');
                    else alert('כדי להתקין: פתחו את תפריט הדפדפן (שלוש נקודות למעלה) ובחרו "התקנת אפליקציה" או "הוספה למסך הבית".');
                });
                document.getElementById('resetBtn').addEventListener('click', function () {
                    if (confirm('פעולה זו תמחק את כל האירועים, המתאמנים וההגדרות. להמשיך?')) {
                        DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
                        saveData(); applyTheme(); renderAll();
                    }
                });
                document.getElementById('exportIcsBtn').addEventListener('click', exportIcs);
            }
            function exportIcs() {
                var ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//לוז אישי//HE\r\n';
                var fmt = function (d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; };
                DATA.events.forEach(function (ev) {
                    var r = eventRange(ev);
                    ics += 'BEGIN:VEVENT\r\nUID:' + ev.id + '@personal-schedule\r\nDTSTART:' + fmt(r.start) + '\r\nDTEND:' + fmt(r.end) + '\r\nSUMMARY:' + (ev.title || TYPE_META[ev.type].label) + '\r\nEND:VEVENT\r\n';
                });
                ics += 'END:VCALENDAR';
                var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
                var a = document.createElement('a'); a.href = url; a.download = 'schedule.ics';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            document.getElementById('greetText').addEventListener('click', function () {
                window.location.href = 'https://scheduliti.github.io';
            });
            /* ---------- init ---------- */
            function renderAll() {
                autoFinalizeTrainings();
                updateGreeting();
                setActiveView(state.view);
                renderSchedule(); renderClients(); renderFinance(); renderSettings();
                checkReminders();
            }
        })();
    </script>
</body>
</html>
