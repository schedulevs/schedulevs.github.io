<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>לו"ז אישי של לב</title>
    <link rel="icon" type="image/x-icon" href="./lev.ico">
    <!-- PWA: מניפסט, צבע נושא ותמיכה במסך בית ב-iOS/Android -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#12141a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="לו״ז לב">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        :root {
            --bg: #12141a;
            --surface: #1b1e26;
            --surface-2: #232733;
            --surface-3: #2a2f3c;
            --border: #2c303c;
            --text: #edeff3;
            --text-muted: #9096a5;
            --text-dim: #5b6072;
            --accent: #f2a93b;
            --accent-ink: #1a1206;
            --mda: #e5484d;
            --mda-bg: rgba(229,72,77,.14);
            --gym: #4c8dff;
            --gym-bg: rgba(76,141,255,.14);
            --training: #34c38f;
            --training-bg: rgba(52,195,143,.14);
            --personal: #8890a0;
            --personal-bg: rgba(136,144,160,.14);
            --danger: #e5484d;
            --ok: #34c38f;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 24px rgba(0,0,0,.35);
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        html[data-theme="light"] {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-2: #f0f1f4;
            --surface-3: #e7e9ee;
            --border: #e1e3e9;
            --text: #1a1c22;
            --text-muted: #63687a;
            --text-dim: #a2a6b3;
            --accent: #c9791f;
            --accent-ink: #fff7ec;
            --mda: #d33338;
            --mda-bg: rgba(211,51,56,.09);
            --gym: #2f6fe0;
            --gym-bg: rgba(47,111,224,.09);
            --training: #1f9e73;
            --training-bg: rgba(31,158,115,.09);
            --personal: #6b7080;
            --personal-bg: rgba(107,112,128,.09);
            --shadow: 0 8px 24px rgba(20,20,30,.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
            font-size: 14px;
            line-height: 1.45;
            overscroll-behavior-y: none;
        }

        button, input, select, textarea {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
        }

        input, select, textarea {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 14px;
            width: 100%;
        }

            input:focus, select:focus, textarea:focus {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }

        label {
            display: block;
            font-size: 12.5px;
            color: var(--text-muted);
            margin: 14px 0 6px;
        }

            label:first-child {
                margin-top: 0;
            }

        h1, h2, h3 {
            margin: 0;
            font-weight: 700;
        }

        .app {
            max-width: 520px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* header */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg);
            padding: 16px 16px 10px;
        }

        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .greet {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.2px;
        }

            .greet .sub {
                display: block;
                font-size: 12.5px;
                font-weight: 400;
                color: var(--text-muted);
                margin-top: 2px;
            }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 38px;
            height: 38px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .icon-btn svg {
                width: 18px;
                height: 18px;
            }

        main {
            flex: 1;
            padding: 0 16px 100px;
        }

        .view {
            display: none;
            animation: fade .18s ease;
        }

            .view.active {
                display: block;
            }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* segmented control */
        .segmented {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 3px;
            margin-bottom: 14px;
        }

            .segmented button {
                flex: 1;
                background: transparent;
                border: 0;
                padding: 8px 4px;
                border-radius: 9px;
                font-size: 13px;
                color: var(--text-muted);
                font-weight: 600;
            }

                .segmented button.active {
                    background: var(--surface-3);
                    color: var(--text);
                }

        /* date nav */
        .datenav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

            .datenav .label {
                font-size: 15px;
                font-weight: 700;
            }

            .datenav .arrows {
                display: flex;
                gap: 6px;
            }

            .datenav button {
                background: var(--surface);
                border: 1px solid var(--border);
                width: 32px;
                height: 32px;
                border-radius: 9px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

                .datenav button svg {
                    width: 15px;
                    height: 15px;
                }

        .today-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* week strip */
        .weekstrip {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .daychip {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 2px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }

            .daychip .dow {
                font-size: 10.5px;
                color: var(--text-muted);
            }

            .daychip .num {
                font-size: 15px;
                font-weight: 700;
            }

            .daychip.selected {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--accent-ink);
            }

                .daychip.selected .dow {
                    color: var(--accent-ink);
                    opacity: .75;
                }

            .daychip .dots {
                display: flex;
                gap: 2px;
                height: 5px;
            }

                .daychip .dots span {
                    width: 4px;
                    height: 4px;
                    border-radius: 50%;
                }

        /* agenda list */
        .agenda-empty {
            text-align: center;
            padding: 56px 20px;
            color: var(--text-muted);
        }

            .agenda-empty .big {
                font-size: 34px;
                margin-bottom: 10px;
            }

            .agenda-empty .cta {
                display: inline-block;
                margin-top: 14px;
            }

        .ev-card {
            display: flex;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }

            .ev-card::before {
                content: "";
                position: absolute;
                inset-inline-start: 0;
                top: 0;
                bottom: 0;
                width: 4px;
                background: var(--c);
            }

        .ev-time {
            min-width: 52px;
            text-align: center;
        }

            .ev-time .t1 {
                font-weight: 700;
                font-size: 14px;
            }

            .ev-time .t2 {
                font-size: 11.5px;
                color: var(--text-muted);
            }

        .ev-body {
            flex: 1;
            min-width: 0;
        }

        .ev-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ev-icon {
            width: 16px;
            height: 16px;
            color: var(--c);
            flex: none;
        }

        .ev-title {
            font-weight: 700;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ev-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ev-tag {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            margin-top: 6px;
            background: var(--cbg);
            color: var(--c);
        }

        .ev-warn {
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--mda);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* month grid */
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 5px;
        }

        .month-dow {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
            padding-bottom: 6px;
            font-weight: 600;
        }

        .month-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            position: relative;
        }

            .month-cell.out {
                opacity: .32;
            }

            .month-cell.today {
                border-color: var(--accent);
            }

            .month-cell.selected {
                background: var(--accent);
            }

                .month-cell.selected .mc-num {
                    color: var(--accent-ink);
                }

        .mc-num {
            font-size: 13px;
            font-weight: 700;
        }

        .mc-dots {
            display: flex;
            gap: 2px;
        }

            .mc-dots span {
                width: 4px;
                height: 4px;
                border-radius: 50%;
            }

        /* cards / sections */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 20px 0 10px;
        }

            .section-title:first-child {
                margin-top: 0;
            }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
        }

            .stat .num {
                font-size: 22px;
                font-weight: 800;
                font-variant-numeric: tabular-nums;
            }

            .stat .lbl {
                font-size: 11.5px;
                color: var(--text-muted);
                margin-top: 2px;
            }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

            .bar-row .lbl {
                width: 78px;
                font-size: 12px;
                color: var(--text-muted);
                flex: none;
            }

        .bar-track {
            flex: 1;
            height: 10px;
            background: var(--surface-2);
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
        }

        .bar-row .val {
            width: 70px;
            text-align: left;
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex: none;
        }

        /* client card */
        .client-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .client-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .client-name {
            font-weight: 700;
            font-size: 15px;
        }

        .client-phone {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .pkg-pill {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 20px;
            background: var(--training-bg);
            color: var(--training);
            white-space: nowrap;
        }

            .pkg-pill.low {
                background: var(--mda-bg);
                color: var(--mda);
            }

        .client-goals {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 0;
            border-radius: var(--radius-sm);
            padding: 11px 16px;
            font-weight: 700;
            font-size: 13.5px;
            width: 100%;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .btn-ghost {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: var(--mda-bg);
            color: var(--mda);
        }

        .btn-sm {
            width: auto;
            padding: 8px 12px;
            font-size: 12.5px;
        }

        .row-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

            .row-btns .btn {
                flex: 1;
            }

        /* type picker */
        .type-picker {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px;
        }

        .type-opt {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

            .type-opt svg {
                width: 18px;
                height: 18px;
                color: var(--c);
            }

            .type-opt span {
                font-size: 11px;
                font-weight: 700;
            }

            .type-opt.selected {
                border-color: var(--c);
                background: var(--cbg);
            }

        .field-row {
            display: flex;
            gap: 10px;
        }

            .field-row > div {
                flex: 1;
            }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 2px;
            border-bottom: 1px solid var(--border);
        }

            .toggle-row:last-child {
                border-bottom: 0;
            }

            .toggle-row .t-main {
                font-size: 13.5px;
                font-weight: 600;
            }

            .toggle-row .t-sub {
                font-size: 11.5px;
                color: var(--text-muted);
                margin-top: 1px;
            }

        .switch {
            position: relative;
            width: 42px;
            height: 24px;
            background: var(--surface-3);
            border-radius: 20px;
            flex: none;
            border: 1px solid var(--border);
        }

            .switch.on {
                background: var(--accent);
                border-color: var(--accent);
            }

            .switch::after {
                content: "";
                position: absolute;
                top: 2px;
                inset-inline-start: 2px;
                width: 18px;
                height: 18px;
                background: #fff;
                border-radius: 50%;
                transition: transform .15s;
            }

            .switch.on::after {
                transform: translateX(-18px);
            }

        html[data-theme="light"] .switch.on::after {
            transform: translateX(18px);
        }

        html[data-theme="dark"] .switch.on::after {
            transform: translateX(-18px);
        }

        .alert {
            display: flex;
            gap: 10px;
            background: var(--mda-bg);
            border: 1px solid rgba(229,72,77,.3);
            color: var(--mda);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 12.5px;
            margin-top: 12px;
        }

            .alert svg {
                width: 16px;
                height: 16px;
                flex: none;
                margin-top: 1px;
            }

            .alert b {
                display: block;
                margin-bottom: 2px;
                font-size: 13px;
            }

            .alert.soft {
                background: var(--surface-2);
                border-color: var(--border);
                color: var(--text-muted);
            }

        /* nav */
        .bottomnav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
        }

        .bottomnav-inner {
            max-width: 520px;
            margin: 0 auto;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 6px 6px calc(6px + var(--safe-b));
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 7px 2px;
            color: var(--text-dim);
            border-radius: 10px;
        }

            .nav-btn svg {
                width: 20px;
                height: 20px;
            }

            .nav-btn span {
                font-size: 10.5px;
                font-weight: 600;
            }

            .nav-btn.active {
                color: var(--accent);
            }

        .fab {
            position: fixed;
            bottom: calc(72px + var(--safe-b));
            left: 50%;
            transform: translateX(-50%);
            z-index: 31;
            background: var(--accent);
            color: var(--accent-ink);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 0;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .fab svg {
                width: 24px;
                height: 24px;
            }

        /* modal */
        .modal-wrap {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
        }

            .modal-wrap.open {
                display: block;
            }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.55);
        }

        .modal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 520px;
            margin: 0 auto;
            background: var(--bg);
            border-radius: 20px 20px 0 0;
            max-height: 90vh;
            overflow-y: auto;
            padding: 14px 18px calc(24px + var(--safe-b));
            border: 1px solid var(--border);
            border-bottom: 0;
        }

        .modal-handle {
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 3px;
            margin: 0 auto 12px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            left: 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            width: 30px;
            height: 30px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

            .modal-close svg {
                width: 14px;
                height: 14px;
            }

        .empty-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 12.5px;
            padding: 30px 10px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        a.plain {
            color: var(--gym);
            text-decoration: none;
            font-weight: 600;
        }

        ::selection {
            background: var(--accent);
            color: var(--accent-ink);
        }
        /* הגבלות למצב אורח */
        .guest-mode #fabAdd,
        .guest-mode #addClientBtn,
        .guest-mode #emptyAddBtn,
        .guest-mode #saveEvBtn,
        .guest-mode #delEvBtn,
        .guest-mode #saveClBtn,
        .guest-mode #delClBtn,
        .guest-mode #resetBtn,
        .guest-mode #editClFromDetail,
        .guest-mode .row-btns .btn-danger,
        .guest-mode .row-btns button[data-cancel] {
            display: none !important;
        }

        .guest-mode input,
        .guest-mode textarea,
        .guest-mode select {
            pointer-events: none;
            opacity: 0.7;
        }

        .guest-mode .switch,
        .guest-mode .type-opt {
            pointer-events: none;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <!-- מסך התחברות -->
    <div id="loginOverlay" style="position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;">
        <h1 style="margin-bottom: 10px;">לו"ז אישי</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px;">נדרשת התחברות מאובטחת כדי לצפות בנתונים ולסנכרן אותם.</p>

                warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 22 20.5H2z"/><path d="M12 9.5v5M12 18h.01"/></svg>',

                check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
                bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
                download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>'
            };
            const TYPE_META = {
                mda: { label: 'מד"א', color: 'var(--mda)', bg: 'var(--mda-bg)', icon: ICONS.pulse },
                gym: { label: 'משמרת ניהול', color: 'var(--gym)', bg: 'var(--gym-bg)', icon: ICONS.brief },
                training: { label: 'אימון אישי', color: 'var(--training)', bg: 'var(--training-bg)', icon: ICONS.dumb },
                personal: { label: 'זמן פרטי', color: 'var(--personal)', bg: 'var(--personal-bg)', icon: ICONS.moon }
            };
            /* ---------------- FIREBASE & STORAGE ---------------- */
            const DEFAULT_DATA = {
                events: [],
                clients: [],
                settings: {
                    theme: 'dark',
                    gymHourlyRate: 35.40,
                    trainingPrice: 80,
                    bufferMinutes: 45,
                    mdaRestHours: 8,
                    lateCancelHours: 12,
                    notificationsEnabled: false,
                    reminderMinutes: 60,
                    morningSummaryEnabled: false,
                    morningSummaryTime: '07:00'
                }
            };
            let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
            let storageReady = false;
            let saveTimer = null;
            let dbUnsubscribe = null;
            let isGuest = false;
            // === החלף בפרטים שלך מ-Firebase Console ===
            const firebaseConfig = {
                apiKey: "AIzaSyBpry7D_rk6D2DGrd-ViaM8fKHV3jvoLr8",
                authDomain: "scheduleapp-230f2.firebaseapp.com",
                projectId: "scheduleapp-230f2",
                storageBucket: "scheduleapp-230f2.firebasestorage.app",
                messagingSenderId: "369647521158",
                appId: "1:369647521158:web:cc0be71365abc1dac3b007",
                measurementId: "G-9VKY09H392"
            };

            // אתחול Firebase
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();

            // הפעלת שמירה מקומית (offline persistence) - כך שהאפליקציה תעבוד גם בלי אינטרנט
            // ותסנכרן אוטומטית את מה שהצטבר ברגע שהחיבור חוזר.
            try {
                db.enablePersistence({ synchronizeTabs: true }).catch(function (err) {
                    if (err.code === 'failed-precondition') {
                        console.warn('שמירה לא מקוונת לא הופעלה - כנראה שיש כמה טאבים פתוחים במקביל.');
                    } else if (err.code === 'unimplemented') {
                        console.warn('הדפדפן הנוכחי לא תומך בשמירה לא מקוונת.');
                    }
                });
            } catch (e) { console.warn('enablePersistence error', e); }

            // רישום Service Worker - מאפשר פתיחת האפליקציה גם ללא אינטרנט (PWA)
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function () {
                    navigator.serviceWorker.register('./sw.js').catch(function (err) {
                        console.warn('רישום Service Worker נכשל', err);
                    });
                });
            }

            // האזנה למצב ההתחברות של המשתמש
            auth.onAuthStateChanged(user => {
                if (user) {
                    // בדיקה האם המשתמש המחובר הוא אתה או אורח
                    isGuest = (user.email !== 'levloovmordehai@gmail.com');

                    // אם זה אורח, נוסיף מחלקה שתחסום את אפשרויות העריכה
                    if (isGuest) {
                        document.body.classList.add('guest-mode');
                    } else {
                        document.body.classList.remove('guest-mode');
                    }

                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    startRealtimeSync(user.uid);
                } else {
                    // המשתמש מנותק
                    document.getElementById('loginOverlay').style.display = 'flex';
                    document.getElementById('app').style.display = 'none';
                    if (dbUnsubscribe) {
                        dbUnsubscribe(); // עצירת סנכרון
                    }
                }
            });

            // התחברות עם כפתור
            document.getElementById('loginBtn').addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => {
                    console.error(err);
                    document.getElementById('loginError').textContent = "שגיאה בהתחברות. נסה שוב.";
                });
            });

            // פונקציה שמקשיבה לשינויים בענן (עובד דינמית על המחשב והטלפון)
            function startRealtimeSync(uid) {
                const docRef = db.collection('users').doc(uid);

                dbUnsubscribe = docRef.onSnapshot(doc => {
                    // השרת אישר!
                    if (doc.exists) {
                        const parsed = doc.data();
                        DATA = Object.assign({}, DEFAULT_DATA, parsed);
                        DATA.settings = Object.assign({}, DEFAULT_DATA.settings, parsed.settings || {});
                    } else {
                        // פעם ראשונה שמתחברים עם משתמש מורשה
                        saveDataToFirebase();
                    }
                    storageReady = true;
                    applyTheme();
                    renderAll();
                }, error => {
                    // כאן הקסם של האבטחה עובד!
                    console.error("שגיאה בהבאת נתונים:", error);

                    // אם השרת של Firebase חסם את הגישה (כי המייל לא תואם ל-Rules)
                    if (error.code === 'permission-denied') {
                        auth.signOut(); // מנתקים אותו מיד
                        document.getElementById('loginError').textContent = "גישה נדחתה ע\"י השרת: אימייל זה אינו מורשה.";
                        document.getElementById('loginOverlay').style.display = 'flex';
                        document.getElementById('app').style.display = 'none';
                    }
                });
            }

            // שמירת נתונים ל-Firebase
            function saveData() {
                if (saveTimer) clearTimeout(saveTimer);
                saveTimer = setTimeout(() => {
                    saveDataToFirebase();
                }, 500); // השהייה קטנה למניעת עומס שמירות
            }

            function saveDataToFirebase() {
                if (isGuest) return; // חסימה מוחלטת: אורח לא יכול לשמור נתונים

                const user = auth.currentUser;
                if (user) {
                    db.collection('users').doc(user.uid).set(JSON.parse(JSON.stringify(DATA)))
                        .catch(e => {
                            console.error('שגיאת שמירה ב-Firebase', e);
                            if (e.code === 'permission-denied') {
                                alert("אין לך הרשאות לשמור נתונים.");
                            }
                        });
                }
            }

            function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

            /* ---------------- DATE HELPERS ---------------- */
            const DOW = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
            const MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
            function pad(n) { return String(n).padStart(2, '0'); }
            function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
            function parseDateStr(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
            function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
            function startOfWeek(d) { const r = new Date(d); const day = r.getDay(); return addDays(r, -day); }
            function sameDate(a, b) { return toDateStr(a) === toDateStr(b); }
            function combineDateTime(dateStr, timeStr) {
                const [h, m] = (timeStr || '00:00').split(':').map(Number);
                const d = parseDateStr(dateStr); d.setHours(h, m, 0, 0); return d;
            }
            function eventRange(ev) {
                const start = combineDateTime(ev.date, ev.startTime);
                let end = combineDateTime(ev.date, ev.endTime);
                if (end.getTime() <= start.getTime()) end = addDays(end, 1);
                return { start, end };
            }
            function fmtHM(mins) {
                const h = Math.floor(mins / 60), m = Math.round(mins % 60);
                if (h <= 0) return m + ' דק\'';
                if (m === 0) return h + ' שע\'';
                return h + ' שע\' ' + m + ' דק\'';
            }
            function money(n) { return '₪' + (Math.round(n * 100) / 100).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

            /* ---------------- STATE ---------------- */
            let state = {
                view: 'schedule',
                scheduleMode: 'day',
                selectedDate: new Date(),
                financeMonth: new Date(),
                editingEventId: null,
                editingClientId: null,
                detailClientId: null
            };

            /* ---------------- CONFLICT / FATIGUE LOGIC ---------------- */
            function findConflicts(draftEv, excludeId) {
                const { start: ns, end: ne } = eventRange(draftEv);
                const buf = (draftEv.type !== 'personal' && draftEv.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0;
                const ps = new Date(ns.getTime() - buf), pe = new Date(ne.getTime() + buf);
                return DATA.events.filter(ev => {
                    if (ev.id === excludeId) return false;
                    const { start: os, end: oe } = eventRange(ev);
                    const obuf = (ev.type !== 'personal' && ev.useBuffer !== false) ? DATA.settings.bufferMinutes * 60000 : 0;
                    const ops = new Date(os.getTime() - obuf), ope = new Date(oe.getTime() + obuf);
                    return ps.getTime() < ope.getTime() && ops.getTime() < pe.getTime();
                });
            }
            function findFatigueIssues(draftEv, excludeId) {
                const issues = [];
                const restMs = DATA.settings.mdaRestHours * 3600000;
                const { start: ns, end: ne } = eventRange(draftEv);
                if (draftEv.type !== 'mda' && draftEv.mdaShiftType !== 'night') {
                    DATA.events.filter(ev => ev.type === 'mda' && ev.mdaShiftType === 'night' && ev.id !== excludeId).forEach(mda => {
                        const { end: mdaEnd } = eventRange(mda);
                        const restUntil = new Date(mdaEnd.getTime() + restMs);
                        if (ns.getTime() < restUntil.getTime() && ne.getTime() > mdaEnd.getTime()) {
                            issues.push({ type: 'blocked-after-shift', restUntil, mda });
                        }
                    });
                }
                if (draftEv.type === 'mda' && draftEv.mdaShiftType === 'night') {
                    const restUntil = new Date(ne.getTime() + restMs);
                    DATA.events.filter(ev => (ev.type === 'gym' || ev.type === 'training') && ev.id !== excludeId).forEach(ev => {
                        const { start: os, end: oe } = eventRange(ev);
                        if (os.getTime() < restUntil.getTime() && oe.getTime() > ne.getTime()) {
                            issues.push({ type: 'conflicts-with-rest', restUntil, ev });
                        }
                    });
                }
                return issues;
            }

            /* ---------------- RENDER: NAV / THEME ---------------- */
            function applyTheme() {
                document.documentElement.setAttribute('data-theme', DATA.settings.theme);
                document.getElementById('themeToggle').innerHTML = DATA.settings.theme === 'dark' ? ICONS.sun : ICONS.moon;
            }
            document.getElementById('themeToggle').addEventListener('click', () => {
                DATA.settings.theme = DATA.settings.theme === 'dark' ? 'light' : 'dark';
                applyTheme(); saveData(); renderSettings();

            const navIcons = { schedule: ICONS.calendar, clients: ICONS.users, finance: ICONS.wallet, settings: ICONS.settings };
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.querySelector('.ic').innerHTML = navIcons[btn.dataset.view];
                btn.addEventListener('click', () => switchView(btn.dataset.view));
