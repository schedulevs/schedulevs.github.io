            document.getElementById('fabAdd').addEventListener('click', () => openEventModal(null));
            document.getElementById('navPrev').innerHTML = ICONS.chevR;
            document.getElementById('navNext').innerHTML = ICONS.chevL;
            document.getElementById('finPrev').innerHTML = ICONS.chevR;
            document.getElementById('finNext').innerHTML = ICONS.chevL;
            document.querySelectorAll('.modal-close').forEach(b => b.innerHTML = ICONS.x);
            document.getElementById('addClientBtn').addEventListener('click', () => openClientModal(null));

            // מיישם רק את מצב התצוגה הפעיל (כרטיסיה/עיצוב), בלי לשנות את ה-view הנוכחי.
            // חשוב: זו הפונקציה שמופעלת גם באתחול/רענון נתונים כדי שהמסך הראשון אכן יוצג מיד.
            function setActiveView(v) {
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                const target = document.getElementById('view-' + v);
                if (target) target.classList.add('active');
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
                document.getElementById('fabAdd').style.display = (v === 'schedule') ? 'flex' : 'none';
            }

            function switchView(v) {
                state.view = v;
                setActiveView(v);
                if (v === 'clients') renderClients();
                if (v === 'finance') renderFinance();
                if (v === 'settings') renderSettings();
            }

            function updateGreeting() {
                const h = new Date().getHours();
                let timeGreeting = 'ערב טוב';
                if (h < 5) timeGreeting = 'לילה טוב';
                else if (h < 12) timeGreeting = 'בוקר טוב';
                else if (h < 17) timeGreeting = 'צהריים טובים';
                else if (h < 20) timeGreeting = 'אחר הצהריים טובים';

                const displayName = isGuest ? 'אורח' : 'לב';

                const greetingEl = document.getElementById('greetText');
                if (greetingEl) {
                    greetingEl.textContent = timeGreeting + ', ' + displayName;
                }
            }

            /* ---------------- SCHEDULE VIEW ---------------- */
            document.querySelectorAll('#scheduleSeg button').forEach(b => {
                b.addEventListener('click', () => {
                    state.scheduleMode = b.dataset.mode;
                    document.querySelectorAll('#scheduleSeg button').forEach(x => x.classList.toggle('active', x === b));
                    renderSchedule();
                });
            });
            document.getElementById('navPrev').addEventListener('click', () => shiftSchedule(1));
            document.getElementById('navNext').addEventListener('click', () => shiftSchedule(-1));
            document.getElementById('navToday').addEventListener('click', () => { state.selectedDate = new Date(); renderSchedule(); });
            function shiftSchedule(dir) {
                // dir: 1 = backward in time (prev, since RTL chevR means "next" visually but we map by function not arrow direction)
                const m = state.scheduleMode;
                if (m === 'day') state.selectedDate = addDays(state.selectedDate, dir * -1);
                else if (m === 'week') state.selectedDate = addDays(state.selectedDate, dir * -7);
                else { const d = new Date(state.selectedDate); d.setMonth(d.getMonth() + (dir * -1)); state.selectedDate = d; }
                renderSchedule();
            }

            function renderSchedule() {
                const mode = state.scheduleMode;
                document.getElementById('weekStripHolder').innerHTML = '';
                document.getElementById('monthGridHolder').innerHTML = '';
                const label = document.getElementById('dateLabel');

                if (mode === 'day') {
                    label.textContent = DOW[state.selectedDate.getDay()] + "' " + state.selectedDate.getDate() + ' ב' + MONTHS[state.selectedDate.getMonth()];
                    renderAgenda(state.selectedDate);
                } else if (mode === 'week') {
                    const wStart = startOfWeek(state.selectedDate);
                    const wEnd = addDays(wStart, 6);
                    label.textContent = wStart.getDate() + '–' + wEnd.getDate() + ' ב' + MONTHS[wEnd.getMonth()];
                    const strip = document.createElement('div'); strip.className = 'weekstrip';
                    for (let i = 0; i < 7; i++) {
                        const d = addDays(wStart, i);
                        const chip = document.createElement('button');
                        chip.className = 'daychip' + (sameDate(d, state.selectedDate) ? ' selected' : '');
                        const evs = eventsOnDate(d);
                        const dotTypes = [...new Set(evs.map(e => e.type))];
                        chip.innerHTML = '<span class="dow">' + DOW[d.getDay()] + '</span><span class="num">' + d.getDate() + '</span><span class="dots">' + dotTypes.map(t => '<span style="background:' + TYPE_META[t].color + '"></span>').join('') + '</span>';
                        chip.addEventListener('click', () => { state.selectedDate = d; renderSchedule(); });
                        strip.appendChild(chip);
                    }
                    document.getElementById('weekStripHolder').appendChild(strip);
                    renderAgenda(state.selectedDate);
                } else {
                    const y = state.selectedDate.getFullYear(), m = state.selectedDate.getMonth();
                    label.textContent = MONTHS[m] + ' ' + y;
                    const grid = document.createElement('div'); grid.className = 'month-grid';
                    DOW.forEach(d => { const c = document.createElement('div'); c.className = 'month-dow'; c.textContent = d; grid.appendChild(c); });
                    const first = new Date(y, m, 1);
                    const gridStart = addDays(first, -first.getDay());
                    const today = new Date();
                    for (let i = 0; i < 42; i++) {
                        const d = addDays(gridStart, i);
                        const cell = document.createElement('div');
                        let cls = 'month-cell';
                        if (d.getMonth() !== m) cls += ' out';
                        if (sameDate(d, today)) cls += ' today';
                        if (sameDate(d, state.selectedDate)) cls += ' selected';
                        cell.className = cls;
                        const evs = eventsOnDate(d);
                        const dotTypes = [...new Set(evs.map(e => e.type))].slice(0, 4);
                        cell.innerHTML = '<span class="mc-num">' + d.getDate() + '</span><span class="mc-dots">' + dotTypes.map(t => '<span style="background:' + TYPE_META[t].color + '"></span>').join('') + '</span>';
                        cell.addEventListener('click', () => {
                            state.selectedDate = d; state.scheduleMode = 'day';
                            document.querySelectorAll('#scheduleSeg button').forEach(x => x.classList.toggle('active', x.dataset.mode === 'day'));
                            renderSchedule();
                        });
                        grid.appendChild(cell);
                    }
                    document.getElementById('monthGridHolder').appendChild(grid);
                    document.getElementById('agendaHolder').innerHTML = '';
                }
            }

            function eventsOnDate(d) {
                const ds = toDateStr(d);
                return DATA.events.filter(ev => {
                    const { start, end } = eventRange(ev);
                    const dayStart = new Date(d); dayStart.setHours(0, 0, 0, 0);
                    const dayEnd = addDays(dayStart, 1);
                    return start.getTime() < dayEnd.getTime() && end.getTime() > dayStart.getTime();
                }).sort((a, b) => a.startTime.localeCompare(b.startTime));
            }

            function renderAgenda(date) {
                const holder = document.getElementById('agendaHolder');
                const evs = eventsOnDate(date);
                if (evs.length === 0) {
                    holder.innerHTML = '<div class="agenda-empty"><div class="big">🗓️</div>אין פעילויות ביום הזה<br><button class="btn btn-ghost cta" id="emptyAddBtn" style="width:auto;">הוספת פעילות +</button></div>';
                    document.getElementById('emptyAddBtn').addEventListener('click', () => openEventModal(null, toDateStr(date)));
                    return;
                }
                holder.innerHTML = '';
                evs.forEach(ev => {
                    const meta = TYPE_META[ev.type];
                    const conflicts = findConflicts(ev, ev.id);
                    const fatigue = findFatigueIssues(ev, ev.id);
                    const card = document.createElement('div');
                    card.className = 'ev-card';
                    card.style.setProperty('--c', meta.color);
                    card.style.setProperty('--cbg', meta.bg);
                    let client = ev.clientId ? DATA.clients.find(c => c.id === ev.clientId) : null;
                    let metaLine = '';
                    if (ev.type === 'training' && client) metaLine = client.name;
                    if (ev.type === 'mda') metaLine = ev.mdaShiftType === 'morning' ? 'משמרת בוקר' : ev.mdaShiftType === 'evening' ? 'משמרת ערב' : 'משמרת לילה';
                    if (ev.type === 'gym' && ev.commission) metaLine = 'עמלות: ' + money(ev.commission);
                    let warnHtml = '';
                    if (conflicts.length) { warnHtml += '<div class="ev-warn">' + ICONS.warn + ' חפיפה עם ' + conflicts.length + ' פעילות/יות</div>'; }
                    if (fatigue.length) { warnHtml += '<div class="ev-warn">' + ICONS.warn + ' בטווח מנוחה נדרש אחרי משמרת לילה</div>'; }
                    card.innerHTML = '<div class="ev-time"><div class="t1">' + ev.startTime + '</div><div class="t2">' + ev.endTime + '</div></div>' +
                        '<div class="ev-body"><div class="ev-title-row"><span class="ev-icon">' + meta.icon + '</span><span class="ev-title">' + escapeHtml(ev.title || meta.label) + '</span></div>' +
                        (metaLine ? '<div class="ev-meta">' + escapeHtml(metaLine) + '</div>' : '') +
                        '<span class="ev-tag">' + meta.label + '</span>' + warnHtml + '</div>';
                    card.addEventListener('click', () => openEventModal(ev.id));
                    holder.appendChild(card);
                });
            }

            function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

            /* ---------------- EVENT MODAL ---------------- */
            function openEventModal(id, presetDate) {
                state.editingEventId = id;
                const ev = id ? DATA.events.find(e => e.id === id) : null;
                document.getElementById('evModalTitle').textContent = ev ? 'עריכת פעילות' : 'פעילות חדשה';
                const draft = ev ? Object.assign({}, ev) : {
                    id: null, type: 'gym', title: '', date: presetDate || toDateStr(state.selectedDate),
                    startTime: '08:00', endTime: '12:00', useBuffer: true, notes: '',
                    mdaShiftType: 'morning', clientId: '', commission: 0, price: DATA.settings.trainingPrice
                };
                renderEventForm(draft);
                document.getElementById('modalEvent').classList.add('open');
            }
            function closeModal(id) { document.getElementById(id).classList.remove('open'); }
            document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => closeModal(el.dataset.close)));
            document.querySelectorAll('.modal-backdrop').forEach(el => el.addEventListener('click', () => el.parentElement.classList.remove('open')));

            function renderEventForm(draft) {
                const body = document.getElementById('evModalBody');
                const trainClients = DATA.clients;
                body.innerHTML = `
                <div class="type-picker" id="typePicker">
                  ${Object.keys(TYPE_META).map(t => `<button class="type-opt ${draft.type === t ? 'selected' : ''}" data-type="${t}" style="--c:${TYPE_META[t].color};--cbg:${TYPE_META[t].bg}">${TYPE_META[t].icon}<span>${TYPE_META[t].label}</span></button>`).join('')}
                </div>
                <label>כותרת (אופציונלי)</label>
                <input id="f_title" value="${escapeHtml(draft.title || '')}" placeholder="${TYPE_META[draft.type].label}">
                <div class="field-row">
                  <div><label>תאריך</label><input type="date" id="f_date" value="${draft.date}"></div>
                  <div></div>
                </div>
                <div class="field-row">
                  <div><label>שעת התחלה</label><input type="time" id="f_start" value="${draft.startTime}"></div>
                  <div><label>שעת סיום</label><input type="time" id="f_end" value="${draft.endTime}"></div>
                </div>
                <div id="typeExtra"></div>
                <div class="toggle-row">
                  <div><div class="t-main">חסימת זמן נסיעה/התארגנות</div><div class="t-sub">${DATA.settings.bufferMinutes} דק' לפני ואחרי</div></div>
                  <div class="switch ${draft.useBuffer !== false ? 'on' : ''}" id="f_buffer"></div>
                </div>
                <label>הערות</label>
                <textarea id="f_notes" rows="2" placeholder="הערות חופשיות...">${escapeHtml(draft.notes || '')}</textarea>
                <div id="conflictBox"></div>
                <div class="row-btns">
                  ${draft.id ? '<button class="btn btn-danger" id="delEvBtn">מחיקה</button>' : ''}
                  <button class="btn btn-primary" id="saveEvBtn">שמירה</button>
                </div>
              `;
                document.getElementById('f_buffer').addEventListener('click', function () { this.classList.toggle('on'); refreshConflictPreview(draft); });

                document.querySelectorAll('#typePicker .type-opt').forEach(btn => {
                    btn.addEventListener('click', () => {
                        draft.type = btn.dataset.type;
                        document.querySelectorAll('#typePicker .type-opt').forEach(b => b.classList.toggle('selected', b === btn));
                        renderTypeExtra(draft);
                        refreshConflictPreview(draft);
                    });
                });
                renderTypeExtra(draft);

                ['f_date', 'f_start', 'f_end'].forEach(id => document.getElementById(id).addEventListener('change', () => refreshConflictPreview(draft)));

                function renderTypeExtra(d) {
                    const box = document.getElementById('typeExtra');
                    if (d.type === 'mda') {
                        box.innerHTML = `<label>סוג משמרת</label>
                  <select id="f_shift">
                    <option value="morning" ${d.mdaShiftType === 'morning' ? 'selected' : ''}>בוקר</option>
                    <option value="evening" ${d.mdaShiftType === 'evening' ? 'selected' : ''}>ערב</option>
                    <option value="night" ${d.mdaShiftType === 'night' ? 'selected' : ''}>לילה</option>
                  </select>`;
                        document.getElementById('f_shift').addEventListener('change', e => { d.mdaShiftType = e.target.value; refreshConflictPreview(d); });
                    } else if (d.type === 'gym') {
                        box.innerHTML = `<label>עמלות מכירה במשמרת (₪)</label><input type="number" id="f_comm" value="${d.commission || 0}" min="0" step="5">`;
                    } else if (d.type === 'training') {
                        box.innerHTML = `<label>מתאמן</label>
                  <select id="f_client"><option value="">— ללא שיוך —</option>${trainClients.map(c => `<option value="${c.id}" ${d.clientId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}</select>
                  <label>תעריף לאימון (₪)</label><input type="number" id="f_price" value="${d.price != null ? d.price : DATA.settings.trainingPrice}" min="0" step="5">`;
                    } else {
                        box.innerHTML = '';
                    }
                }

                function refreshConflictPreview(d) {
                    const test = {
                        id: d.id, type: d.type, date: document.getElementById('f_date').value,
                        startTime: document.getElementById('f_start').value, endTime: document.getElementById('f_end').value,
                        useBuffer: document.getElementById('f_buffer').classList.contains('on'),
                        mdaShiftType: d.mdaShiftType
                    };
                    const conflicts = findConflicts(test, d.id);
                    const fatigue = findFatigueIssues(test, d.id);
                    const box = document.getElementById('conflictBox');
                    let html = '';
                    if (conflicts.length) {
                        html += '<div class="alert">' + ICONS.warn + '<div><b>זוהתה חפיפה</b>חופפת ל' + conflicts.map(c => TYPE_META[c.type].label + ' (' + c.startTime + '–' + c.endTime + ')').join(', ') + (document.getElementById('f_buffer').classList.contains('on') ? ' (כולל זמן חוצץ)' : '') + '</div></div>';
                    }
                    fatigue.forEach(f => {
                        if (f.type === 'blocked-after-shift') {
                            html += '<div class="alert">' + ICONS.warn + '<div><b>מתחת לזמן מנוחה</b>נדרשת מנוחה עד השעה ' + pad(f.restUntil.getHours()) + ':' + pad(f.restUntil.getMinutes()) + ' לאחר משמרת לילה במד"א</div></div>';
                        } else {
                            html += '<div class="alert">' + ICONS.warn + '<div><b>פוגע בזמן מנוחה</b>הפעילות "' + TYPE_META[f.ev.type].label + '" (' + f.ev.startTime + ') נמצאת בטווח מנוחה נדרש עד ' + pad(f.restUntil.getHours()) + ':' + pad(f.restUntil.getMinutes()) + '</div></div>';
                        }
                    });
                    box.innerHTML = html;
                }
                refreshConflictPreview(draft);

                document.getElementById('saveEvBtn').addEventListener('click', () => {
                    draft.title = document.getElementById('f_title').value.trim();
                    draft.date = document.getElementById('f_date').value;
                    draft.startTime = document.getElementById('f_start').value;
                    draft.endTime = document.getElementById('f_end').value;
                    draft.useBuffer = document.getElementById('f_buffer').classList.contains('on');
                    draft.notes = document.getElementById('f_notes').value.trim();
                    if (draft.type === 'mda') { draft.mdaShiftType = document.getElementById('f_shift').value; }
                    if (draft.type === 'gym') { draft.commission = parseFloat(document.getElementById('f_comm').value) || 0; }
                    if (draft.type === 'training') {
                        draft.clientId = document.getElementById('f_client').value || '';
                        draft.price = parseFloat(document.getElementById('f_price').value) || DATA.settings.trainingPrice;
                    }
                    if (!draft.date || !draft.startTime || !draft.endTime) { alert('נא למלא תאריך ושעות'); return; }
                    if (draft.id) {
                        const idx = DATA.events.findIndex(e => e.id === draft.id);
                        DATA.events[idx] = draft;
                    } else {
                        draft.id = uid();
                        draft.status = draft.type === 'training' ? 'scheduled' : undefined;
                        DATA.events.push(draft);
                    }
                    saveData();
                    closeModal('modalEvent');
                    renderSchedule();
                    if (state.view === 'finance') renderFinance();
                });
                if (draft.id) {
                    document.getElementById('delEvBtn').addEventListener('click', () => {
                        if (confirm('למחוק את הפעילות?')) {
                            DATA.events = DATA.events.filter(e => e.id !== draft.id);
                            saveData(); closeModal('modalEvent'); renderSchedule();
                        }
                    });
                }
            }

            /* ---------------- CLIENTS ---------------- */
            function renderClients() {
                const holder = document.getElementById('clientsHolder');
                if (DATA.clients.length === 0) {
                    holder.innerHTML = '<div class="agenda-empty">' + ICONS.users.replace('width="24" height="24"', 'width="40" height="40"') + '<div style="margin-top:10px;">אין עדיין מתאמנים רשומים<br>הוספת מתאמן תאפשר מעקב כרטיסיות ונוכחות</div></div>';
                    return;
                }
                holder.innerHTML = '';
                DATA.clients.forEach(c => {
                    const remaining = (c.packageTotal || 0) - (c.packageUsed || 0);
                    const low = remaining <= 2;
                    const div = document.createElement('div');
                    div.className = 'client-card';
                    div.innerHTML = `<div class="client-top">
                  <div><div class="client-name">${escapeHtml(c.name)}</div>${c.phone ? '<div class="client-phone">' + escapeHtml(c.phone) + '</div>' : ''}</div>
                  <span class="pkg-pill ${low ? 'low' : ''}">${remaining} נותרו</span>
                </div>${c.goals ? '<div class="client-goals">🎯 ' + escapeHtml(c.goals) + '</div>' : ''}`;
                    div.addEventListener('click', () => openClientDetail(c.id));
                    holder.appendChild(div);
                });
            }

            function openClientModal(id) {
                state.editingClientId = id;
                const c = id ? DATA.clients.find(x => x.id === id) : null;
                document.getElementById('clModalTitle').textContent = c ? 'עריכת מתאמן' : 'מתאמן חדש';
                const draft = c ? Object.assign({}, c) : { id: null, name: '', phone: '', goals: '', medical: '', packageTotal: 10, packageUsed: 0, history: [] };
                document.getElementById('clModalBody').innerHTML = `
                <label>שם מלא</label><input id="c_name" value="${escapeHtml(draft.name)}">
                <label>טלפון</label><input id="c_phone" value="${escapeHtml(draft.phone || '')}" type="tel">
                <label>מטרות כושר</label><input id="c_goals" value="${escapeHtml(draft.goals || '')}">
                <label>הערות רפואיות / מגבלות</label><textarea id="c_med" rows="2">${escapeHtml(draft.medical || '')}</textarea>
                <div class="field-row">
                  <div><label>סה"כ אימונים בכרטיסייה</label><input id="c_total" type="number" min="0" value="${draft.packageTotal || 0}"></div>
                  <div><label>נוצלו עד כה</label><input id="c_used" type="number" min="0" value="${draft.packageUsed || 0}"></div>
                </div>
                <div class="row-btns">
                  ${draft.id ? '<button class="btn btn-danger" id="delClBtn">מחיקה</button>' : ''}
                  <button class="btn btn-primary" id="saveClBtn">שמירה</button>
                </div>`;
                document.getElementById('saveClBtn').addEventListener('click', () => {
                    draft.name = document.getElementById('c_name').value.trim();
                    if (!draft.name) { alert('נא להזין שם'); return; }
                    draft.phone = document.getElementById('c_phone').value.trim();
                    draft.goals = document.getElementById('c_goals').value.trim();
                    draft.medical = document.getElementById('c_med').value.trim();
                    draft.packageTotal = parseInt(document.getElementById('c_total').value) || 0;
                    draft.packageUsed = parseInt(document.getElementById('c_used').value) || 0;
                    draft.history = draft.history || [];
                    if (draft.id) { const idx = DATA.clients.findIndex(x => x.id === draft.id); DATA.clients[idx] = draft; }
                    else { draft.id = uid(); DATA.clients.push(draft); }
                    saveData(); closeModal('modalClient'); renderClients();
                });
                if (draft.id) {
                    document.getElementById('delClBtn').addEventListener('click', () => {
                        if (confirm('למחוק את המתאמן? (האימונים המשויכים יישארו ביומן ללא שיוך)')) {
                            DATA.clients = DATA.clients.filter(x => x.id !== draft.id);
                            DATA.events.forEach(e => { if (e.clientId === draft.id) e.clientId = ''; });
                            saveData(); closeModal('modalClient'); renderClients();
                        }
                    });
                }
                document.getElementById('modalClient').classList.add('open');
            }

            function openClientDetail(id) {
                state.detailClientId = id;
                const c = DATA.clients.find(x => x.id === id);
                const remaining = (c.packageTotal || 0) - (c.packageUsed || 0);
                const upcoming = DATA.events.filter(e => e.type === 'training' && e.clientId === id && parseDateStr(e.date) >= new Date(new Date().setHours(0, 0, 0, 0))).sort((a, b) => a.date.localeCompare(b.date));
                const history = (c.history || []).slice().reverse();
                document.getElementById('clDetailBody').innerHTML = `
                <div class="modal-title">${escapeHtml(c.name)}</div>
                ${c.phone ? '<div class="client-phone" style="margin-bottom:10px;">' + escapeHtml(c.phone) + '</div>' : ''}
                <div class="stat-grid" style="margin:12px 0;">
                  <div class="stat"><div class="num">${remaining}</div><div class="lbl">אימונים נותרו</div></div>
                  <div class="stat"><div class="num">${c.packageUsed || 0}/${c.packageTotal || 0}</div><div class="lbl">נוצלו</div></div>
                </div>
                ${c.goals ? '<div class="section-title">מטרות</div><div>' + escapeHtml(c.goals) + '</div>' : ''}
                ${c.medical ? '<div class="section-title">הערות רפואיות</div><div>' + escapeHtml(c.medical) + '</div>' : ''}
                <div class="section-title">אימונים קרובים</div>
                ${upcoming.length ? upcoming.map(e => `<div class="ev-card" style="--c:${TYPE_META.training.color};--cbg:${TYPE_META.training.bg}"><div class="ev-time"><div class="t1">${e.startTime}</div><div class="t2">${e.date.slice(5)}</div></div>
                  <div class="ev-body"><div class="ev-title">${escapeHtml(e.title || 'אימון אישי')}</div>
                  <div class="row-btns">
                    <button class="btn btn-ghost btn-sm" data-checkin="${e.id}">${ICONS.check} הגיע</button>
                    <button class="btn btn-danger btn-sm" data-cancel="${e.id}">ביטול</button>
                  </div></div></div>`).join('') : '<div class="empty-note">אין אימונים עתידיים מתוזמנים</div>'}
                <div class="section-title">היסטוריה</div>
                ${history.length ? history.slice(0, 10).map(h => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
                  <span>${h.date}</span><span style="color:${h.status === 'attended' ? 'var(--training)' : 'var(--mda)'}">${h.status === 'attended' ? 'הגיע' : h.status === 'late-cancel' ? 'ביטול מאוחר' : 'ביטול'}</span></div>`).join('') : '<div class="empty-note">אין היסטוריה עדיין</div>'}
                <div class="row-btns">
                  <button class="btn btn-ghost" id="editClFromDetail">עריכת פרטים</button>
                </div>
              `;
                document.getElementById('editClFromDetail').addEventListener('click', () => { closeModal('modalClientDetail'); openClientModal(id); });
                document.querySelectorAll('[data-checkin]').forEach(b => b.addEventListener('click', () => markTraining(b.dataset.checkin, 'attended')));
                document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => {
                    const late = confirm('האם זהו ביטול מאוחר (מנוכה מהכרטיסייה)? אישור = כן, ביטול = לא');
                    markTraining(b.dataset.cancel, late ? 'late-cancel' : 'cancelled');
                }));
                document.getElementById('modalClientDetail').classList.add('open');
            }
            function markTraining(eventId, status) {
                const ev = DATA.events.find(e => e.id === eventId);
                if (!ev) return;
                ev.status = status;
                const c = DATA.clients.find(x => x.id === ev.clientId);
                if (c) {
                    c.history = c.history || [];
                    c.history.push({ id: uid(), date: ev.date, status, eventId });
                    if (status === 'attended' || status === 'late-cancel') { c.packageUsed = (c.packageUsed || 0) + 1; }
                }
                saveData();
                openClientDetail(ev.clientId);
                renderClients();
            }

            /* ---------------- FINANCE ---------------- */
            document.getElementById('finPrev').addEventListener('click', () => { const d = new Date(state.financeMonth); d.setMonth(d.getMonth() - 1); state.financeMonth = d; renderFinance(); });
            document.getElementById('finNext').addEventListener('click', () => { const d = new Date(state.financeMonth); d.setMonth(d.getMonth() + 1); state.financeMonth = d; renderFinance(); });

            function renderFinance() {
                const y = state.financeMonth.getFullYear(), m = state.financeMonth.getMonth();
                document.getElementById('finLabel').textContent = MONTHS[m] + ' ' + y;
                const inMonth = DATA.events.filter(e => { const d = parseDateStr(e.date); return d.getFullYear() === y && d.getMonth() === m; });

                let gymHours = 0, gymCommission = 0, mdaHours = 0, trainingCount = 0, trainingIncome = 0, trainingScheduled = 0;
                inMonth.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const hrs = (end - start) / 3600000;
                    if (ev.type === 'gym') { gymHours += hrs; gymCommission += (ev.commission || 0); }
                    if (ev.type === 'mda') { mdaHours += hrs; }
                    if (ev.type === 'training') {
                        trainingScheduled++;
                        if (ev.status === 'attended' || ev.status === 'late-cancel') { trainingCount++; trainingIncome += (ev.price != null ? ev.price : DATA.settings.trainingPrice); }
                    }
                });
                const gymIncome = gymHours * DATA.settings.gymHourlyRate + gymCommission;
                const totalIncome = gymIncome + trainingIncome;
                const totalWorkHours = gymHours + (trainingCount * 1); // approx 1hr per training session for hours summary

                const holder = document.getElementById('financeHolder');
                holder.innerHTML = `
                <div class="card">
                  <div class="section-title" style="margin-top:0;">סה"כ הכנסה חודשית</div>
                  <div style="font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;">${money(totalIncome)}</div>
                </div>
                <div class="stat-grid">
                  <div class="stat"><div class="num">${money(gymIncome)}</div><div class="lbl">הכנסה מניהול</div></div>
                  <div class="stat"><div class="num">${money(trainingIncome)}</div><div class="lbl">הכנסה מאימונים</div></div>
                  <div class="stat"><div class="num">${gymHours.toFixed(1)}</div><div class="lbl">שעות ניהול</div></div>
                  <div class="stat"><div class="num">${trainingCount}/${trainingScheduled}</div><div class="lbl">אימונים שבוצעו</div></div>
                  <div class="stat"><div class="num">${mdaHours.toFixed(1)}</div><div class="lbl">שעות התנדבות מד"א</div></div>
                  <div class="stat"><div class="num">${money(gymCommission)}</div><div class="lbl">עמלות מכירה</div></div>
                </div>
                <div class="section-title">פילוח הכנסה</div>
                <div class="card">
                  ${financeBar('ניהול', gymIncome, totalIncome || 1, 'var(--gym)')}
                  ${financeBar('אימונים', trainingIncome, totalIncome || 1, 'var(--training)')}
                </div>
                <div class="section-title">חלוקת שעות</div>
                <div class="card">
                  ${financeBar('ניהול', gymHours, (gymHours + mdaHours) || 1, 'var(--gym)')}
                  ${financeBar('מד"א (התנדבות)', mdaHours, (gymHours + mdaHours) || 1, 'var(--mda)')}
                </div>
              `;
            }
            function financeBar(label, val, total, color) {
                const pct = Math.max(2, Math.min(100, (val / total) * 100));
                return `<div class="bar-row"><span class="lbl">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="val">${typeof val === 'number' && val < 50 && val % 1 !== 0 ? val.toFixed(1) : money(val)}</span></div>`;
            }

            /* ---------------- התראות מקומיות (תזכורות + סיכום בוקר) ---------------- */
            // הערה חשובה: זהו מנגנון תזכורות מקומי (Local Notifications).
            // הוא פועל כל עוד הדפדפן/האפליקציה המותקנת רצים (ברקע אם התקנת אותה למסך הבית).
            // התראות Push אמיתיות שמגיעות גם כשהאפליקציה סגורה לחלוטין דורשות שרת דחיפה (Firebase Cloud Messaging + פונקציה בענן)
            // שלא ניתן להוסיף בקובץ סטטי בלבד - זה שיפור עתידי אפשרי אם תרצה.
            let deferredInstallPrompt = null;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredInstallPrompt = e;
                const btn = document.getElementById('installAppBtn');
                if (btn) btn.style.display = 'block';
            });

            function showAppNotification(title, body, tag) {
                const opts = { body: body, icon: './icon-192.png', badge: './icon-192.png', tag: tag, dir: 'rtl', lang: 'he' };
                if (navigator.serviceWorker && navigator.serviceWorker.ready) {
                    navigator.serviceWorker.ready.then(function (reg) {
                        reg.showNotification(title, opts);
                    }).catch(function () {
                        try { new Notification(title, opts); } catch (e) { /* ignore */ }
                    });
                } else {
                    try { new Notification(title, opts); } catch (e) { /* ignore */ }
                }
            }

            function getNotifiedSet() {
                try { return new Set(JSON.parse(localStorage.getItem('lev_notified_events') || '[]')); }
                catch (e) { return new Set(); }
            }
            function saveNotifiedSet(set) {
                try { localStorage.setItem('lev_notified_events', JSON.stringify(Array.from(set).slice(-500))); }
                catch (e) { /* ignore */ }
            }

            function checkReminders() {
                if (!storageReady) return;
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                const now = new Date();

                if (DATA.settings.notificationsEnabled) {
                    const reminderMs = (DATA.settings.reminderMinutes || 60) * 60000;
                    const notified = getNotifiedSet();
                    DATA.events.forEach(function (ev) {
                        const key = 'ev_' + ev.id;
                        if (notified.has(key)) return;
                        const range = eventRange(ev);
                        const diff = range.start.getTime() - now.getTime();
                        if (diff > 0 && diff <= reminderMs) {
                            const meta = TYPE_META[ev.type];
                            let body = ev.title || meta.label;
                            if (ev.type === 'training' && ev.clientId) {
                                const c = DATA.clients.find(function (x) { return x.id === ev.clientId; });
                                if (c) body = 'אימון עם ' + c.name;
                            }
                            showAppNotification('עוד ' + Math.round(diff / 60000) + ' דק\' - ' + meta.label, body + ' בשעה ' + ev.startTime, key);
                            notified.add(key);
                            saveNotifiedSet(notified);
                        }
                    });
                }

                if (DATA.settings.morningSummaryEnabled) {
                    const todayStr = toDateStr(now);
                    const lastSummary = localStorage.getItem('lev_last_summary_date');
                    const parts = (DATA.settings.morningSummaryTime || '07:00').split(':').map(Number);
                    const summaryTime = new Date(now); summaryTime.setHours(parts[0] || 7, parts[1] || 0, 0, 0);
                    if (lastSummary !== todayStr && now.getTime() >= summaryTime.getTime()) {
                        const todays = eventsOnDate(now);
                        let body;
                        if (todays.length === 0) body = 'אין פעילויות מתוכננות להיום';
                        else body = todays.map(function (e) { return e.startTime + ' - ' + (e.title || TYPE_META[e.type].label); }).join(' | ');
                        showAppNotification('סיכום היום שלך', body, 'morning-summary');
                        try { localStorage.setItem('lev_last_summary_date', todayStr); } catch (e) { /* ignore */ }
                    }
                }
            }
            setInterval(checkReminders, 30000);

            /* ---------------- SETTINGS ---------------- */
            function renderSettings() {
                const s = DATA.settings;
                const holder = document.getElementById('settingsHolder');
                const notifSupported = ('Notification' in window);
                const permStatus = notifSupported ? Notification.permission : 'unsupported';
                let permNote = '';
                if (!notifSupported) permNote = 'הדפדפן הזה לא תומך בהתראות.';
                else if (permStatus === 'granted') permNote = 'הרשאת התראות ניתנה ✓';
                else if (permStatus === 'denied') permNote = 'ההתראות חסומות ברמת הדפדפן/המכשיר. יש לאפשר זאת ידנית בהגדרות המכשיר כדי שהתזכורות יעבדו.';
                else permNote = 'יש להפעיל את המתג כדי לאשר קבלת התראות מהדפדפן.';

                holder.innerHTML = `
                <div class="section-title" style="margin-top:0;">תעריפים</div>
                <div class="card">
                  <label>תעריף שעתי – ניהול (₪)</label><input type="number" id="s_rate" value="${s.gymHourlyRate}" step="0.1">
                  <label>מחיר אימון אישי (₪)</label><input type="number" id="s_price" value="${s.trainingPrice}" step="5">
                </div>
                <div class="section-title">חסימות ומרווחים</div>
                <div class="card">
                  <label>זמן נסיעה/התארגנות בין פעילויות (דקות)</label><input type="number" id="s_buffer" value="${s.bufferMinutes}" step="5">
                  <label>שעות מנוחה נדרשות אחרי משמרת לילה במד"א</label><input type="number" id="s_rest" value="${s.mdaRestHours}" step="0.5">
                </div>
                <div class="section-title">התראות ותזכורות</div>
                <div class="card">
                  <div class="toggle-row">
                    <div><div class="t-main">תזכורות לפני פעילות</div><div class="t-sub">התראה בדפדפן/באפליקציה המותקנת לפני כל פעילות</div></div>
                    <div class="switch ${s.notificationsEnabled ? 'on' : ''}" id="s_notif"></div>
                  </div>
                  <label>כמה דקות לפני להתריע</label><input type="number" id="s_remind_min" value="${s.reminderMinutes || 60}" min="5" step="5">
                  <div class="toggle-row">
                    <div><div class="t-main">סיכום בוקר יומי</div><div class="t-sub">התראה יומית עם רשימת הפעילויות של היום</div></div>
                    <div class="switch ${s.morningSummaryEnabled ? 'on' : ''}" id="s_morning"></div>
                  </div>
                  <label>שעת סיכום בוקר</label><input type="time" id="s_morning_time" value="${s.morningSummaryTime || '07:00'}">
                  <div class="alert soft">${ICONS.bell}<div><b>סטטוס הרשאה</b>${permNote}</div></div>
                  <div class="alert soft">${ICONS.warn}<div><b>לתשומת לבך</b>התראות אלו פועלות כל עוד הדפדפן פתוח, או ברקע אם התקנת את האפליקציה למסך הבית. התראות שמגיעות גם כשהאפליקציה סגורה לחלוטין דורשות שרת דחיפה ייעודי ואינן זמינות בגרסה הזו.</div></div>
                </div>
                <div class="section-title">כללי</div>
                <div class="card">
                  <div class="toggle-row"><div><div class="t-main">מצב כהה</div><div class="t-sub">עיצוב נוח לעיניים בשעות החושך (ברירת מחדל, ניתן לשינוי)</div></div>
                    <div class="switch ${s.theme === 'dark' ? 'on' : ''}" id="s_theme"></div></div>
                </div>
                <div class="section-title">התקנה ומצב לא-מקוון</div>
                <div class="card">
                  <div class="empty-note" style="padding:6px 0 12px;text-align:right;">התקנת האפליקציה למסך הבית מאפשרת פתיחה מהירה כמו אפליקציה רגילה, ועובדת גם עם קליטה חלשה - הנתונים יסתנכרנו אוטומטית ברגע שהאינטרנט יחזור.</div>
                  <button class="btn btn-ghost" id="installAppBtn" style="display:${deferredInstallPrompt ? 'flex' : 'none'};margin-bottom:8px;">${ICONS.download} התקנת האפליקציה על המכשיר</button>
                </div>
                <div class="section-title">סנכרון יומן</div>
                <div class="card">
                  <div class="empty-note" style="padding:6px 0 12px;text-align:right;">סנכרון דו-כיווני מלא עם Google Calendar / Apple Calendar דורש חיבור לשרת חיצוני (למשל Supabase) שאינו זמין בתצוגה העצמאית הזו. אפשר לייצא את הלו"ז כקובץ ICS ולייבא אותו ידנית ליומן.</div>
                  <button class="btn btn-ghost" id="exportIcsBtn">ייצוא ICS</button>
                </div>
                <div class="section-title">נתונים</div>
                <div class="card">
                  <button class="btn btn-danger" id="resetBtn">${ICONS.trash} איפוס כל הנתונים</button>
                </div>
                <div class="empty-note">הנתונים נשמרים באופן פרטי בחשבון שלך בלבד.</div>
              `;
                document.getElementById('s_theme').addEventListener('click', function () {
                    this.classList.toggle('on');
                    s.theme = this.classList.contains('on') ? 'dark' : 'light';
                    applyTheme(); saveData();
                });
                ['s_rate', 's_price', 's_buffer', 's_rest'].forEach(id => {
                    document.getElementById(id).addEventListener('change', e => {
                        const map = { s_rate: 'gymHourlyRate', s_price: 'trainingPrice', s_buffer: 'bufferMinutes', s_rest: 'mdaRestHours' };
                        s[map[id]] = parseFloat(e.target.value) || 0;
                        saveData();
                    });
                });

                document.getElementById('s_notif').addEventListener('click', function () {
                    const sw = this;
                    if (!sw.classList.contains('on')) {
                        if (!notifSupported) { alert('הדפדפן הזה לא תומך בהתראות'); return; }
                        Notification.requestPermission().then(function (perm) {
                            if (perm === 'granted') {
                                sw.classList.add('on');
                                s.notificationsEnabled = true;
                            } else {
                                s.notificationsEnabled = false;
                                alert('לא ניתנה הרשאה להתראות. יש לאפשר זאת בהגדרות הדפדפן/המכשיר.');
                            }
                            saveData(); renderSettings();
                        });
                    } else {
                        sw.classList.remove('on');
                        s.notificationsEnabled = false;
                        saveData();
                    }
                });
                document.getElementById('s_remind_min').addEventListener('change', e => { s.reminderMinutes = parseInt(e.target.value) || 60; saveData(); });

                document.getElementById('s_morning').addEventListener('click', function () {
                    const sw = this;
                    if (!sw.classList.contains('on')) {
                        if (!notifSupported) { alert('הדפדפן הזה לא תומך בהתראות'); return; }
                        Notification.requestPermission().then(function (perm) {
                            if (perm === 'granted') {
                                sw.classList.add('on');
                                s.morningSummaryEnabled = true;
                            } else {
                                s.morningSummaryEnabled = false;
                                alert('לא ניתנה הרשאה להתראות. יש לאפשר זאת בהגדרות הדפדפן/המכשיר.');
                            }
                            saveData(); renderSettings();
                        });
                    } else {
                        sw.classList.remove('on');
                        s.morningSummaryEnabled = false;
                        saveData();
                    }
                });
                document.getElementById('s_morning_time').addEventListener('change', e => { s.morningSummaryTime = e.target.value || '07:00'; saveData(); });

                const installBtn = document.getElementById('installAppBtn');
                if (installBtn) {
                    installBtn.addEventListener('click', function () {
                        if (!deferredInstallPrompt) return;
                        deferredInstallPrompt.prompt();
                        deferredInstallPrompt.userChoice.then(function () {
                            deferredInstallPrompt = null;
                            installBtn.style.display = 'none';
                        });
                    });
                }

                document.getElementById('resetBtn').addEventListener('click', () => {
                    if (confirm('פעולה זו תמחק את כל האירועים, המתאמנים וההגדרות. להמשיך?')) {
                        DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
                        saveData(); applyTheme(); renderAll();
                    }
                });
                document.getElementById('exportIcsBtn').addEventListener('click', exportIcs);
            }

            function exportIcs() {
                let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//לוז אישי//HE\r\n';
                DATA.events.forEach(ev => {
                    const { start, end } = eventRange(ev);
                    const fmt = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
                    ics += 'BEGIN:VEVENT\r\nUID:' + ev.id + '@personal-schedule\r\nDTSTART:' + fmt(start) + '\r\nDTEND:' + fmt(end) + '\r\nSUMMARY:' + (ev.title || TYPE_META[ev.type].label) + '\r\nEND:VEVENT\r\n';
                });
                ics += 'END:VCALENDAR';
                const blob = new Blob([ics], { type: 'text/calendar' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'schedule.ics';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            /* ---------------- INIT ---------------- */
            function renderAll() {
                updateGreeting();
                setActiveView(state.view); // מציג מיד את התצוגה הנוכחית (בד"כ לו"ז) בלי לחכות למעבר ידני בין טאבים
                renderSchedule();
                renderClients();
                renderFinance();
                renderSettings();
                checkReminders();
            }
        })();
    </script>
</body>
</html>
